<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="icon.ico" type="image/x-icon" />
  <title>LEADERS Editor</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="loader.css" />
  <link rel="stylesheet" href="tooltip.css" />
  <link rel="stylesheet" href="touch.css" />
</head>
<body>

  <!-- ── Loader ── -->
  <div id="loader">
    <div id="loader-inner">
      <div id="loader-title">LEADERS</div>
      <div id="loader-bar-track">
        <div id="loader-bar-fill">
          <div id="loader-bar-shimmer"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Barre d'outils ── -->
  <div id="toolbar">
    <div class="left-group">
      <button id="btn-toggle-pal2" class="btn" title="Stratégies">
        <svg height="18px" width="18px" viewBox="0 -960 960 960" fill="currentColor"><path d="M200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h560q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120H200Zm120-80v-560H200v560h120Zm80 0h360v-560H400v560Zm-80 0H200h120Z"/></svg>
      </button>
      <a href="https://mthbrt.github.io/Leaders-editor/" class="logo">LEADERS</a>
    </div>

    <div class="center-group">
      <button id="btn-undo" class="btn" title="Undo">
        <svg height="18" viewBox="0 -960 960 960" width="18" fill="currentColor"><path d="M280-200v-80h284q63 0 109.5-40T720-420q0-60-46.5-100T564-560H312l104 104-56 56-200-200 200-200 56 56-104 104h252q97 0 166.5 63T800-420q0 94-69.5 157T564-200H280Z"/></svg>
      </button>
      <button id="btn-redo" class="btn" title="Redo">
        <svg height="18" viewBox="0 -960 960 960" width="18" fill="currentColor"><path d="M396-200q-97 0-166.5-63T160-420q0-94 69.5-157T396-640h252L544-744l56-56 200 200-200 200-56-56 104-104H396q-63 0-109.5 40T240-420q0 60 46.5 100T396-280h284v80H396Z"/></svg>
      </button>
      <div class="toolbar-sep"></div>
      <button id="btn-flip-colors" class="btn" title="Invert colors">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 3 A9 9 0 0 1 12 21 Z" fill="currentColor" stroke="none"/>
        </svg>
      </button>
      <button id="btn-flip-pos" class="btn" title="Swap point of view">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 16V4m0 0L3 8m4-4 4 4"/>
          <path d="M17 8v12m0 0 4-4m-4 4-4-4"/>
        </svg>
      </button>
      <button id="btn-flip-pos-v" class="btn" title="Swap point of view (vertical)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg" transform="rotate(90)scale(-1 1)">
          <path d="M7 16V4m0 0L3 8m4-4 4 4m6 0v12m0 0 4-4m-4 4-4-4"/>
        </svg>
      </button>
    </div>

    <div class="right-group">
      <button id="btn-help" class="btn" title="Aide / Help">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
          <line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
      </button>
      <button id="btn-settings" class="btn" title="Paramètres">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="2.5"/>
          <path d="M18.5 14.5a1.4 1.4 0 0 0 .3 1.6l.05.05a1.8 1.8 0 0 1-2.55 2.55l-.05-.05a1.4 1.4 0 0 0-1.6-.3 1.4 1.4 0 0 0-.9 1.3V20a1.8 1.8 0 0 1-3.6 0v-.05a1.4 1.4 0 0 0-.9-1.3 1.4 1.4 0 0 0-1.6.3L7.6 19a1.8 1.8 0 0 1-2.55-2.55l.05-.05a1.4 1.4 0 0 0 .3-1.6 1.4 1.4 0 0 0-1.3-.9H4a1.8 1.8 0 0 1 0-3.6h.05a1.4 1.4 0 0 0 1.3-.9 1.4 1.4 0 0 0-.3-1.6L5 7.75A1.8 1.8 0 1 1 7.55 5.2l.05.05a1.4 1.4 0 0 0 1.6.3h.02a1.4 1.4 0 0 0 .88-1.28V4a1.8 1.8 0 0 1 3.6 0v.05a1.4 1.4 0 0 0 .9 1.3 1.4 1.4 0 0 0 1.6-.3l.05-.05a1.8 1.8 0 1 1 2.55 2.55l-.05.05a1.4 1.4 0 0 0-.3 1.6v.02a1.4 1.4 0 0 0 1.28.88H20a1.8 1.8 0 0 1 0 3.6h-.05a1.4 1.4 0 0 0-1.3.9z"/>
        </svg>
      </button>
      <button id="btn-toggle-palette" class="btn" title="Afficher/masquer les personnages">
        <svg height="18" width="18" viewBox="0 -960 960 960" fill="currentColor" xmlns="http://www.w3.org/2000/svg" version="1.1" xmlns:xlink="http://www.w3.org/1999/xlink" transform="matrix(-1,0,0,1,0,0)"><path d="M200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h560q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120H200Zm120-80v-560H200v560h120Zm80 0h360v-560H400v560Zm-80 0H200h120Z"></path></svg>
      </button>
    </div>
  </div>

  <!-- Hidden input for clipboard load -->
  <input id="_hidden-input-state" type="text" style="position:absolute;left:-9999px;opacity:0;pointer-events:none;" autocomplete="off" />

  <!-- ── Plateau principal ── -->
  <div id="main">
    <div id="board-layer"></div>
    <div id="droptarget-layer"></div>
    <div id="labels-layer"></div>
    <div id="tokens-layer"></div>
    <div id="markers-layer"></div>
    <svg id="arrows-svg" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <!-- Help popup -->
  <div id="help-overlay" class="hidden">
    <div id="help-popup">
      <div id="help-header">
        <span id="help-title">Commandes</span>
        <button id="help-close">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <line x1="1" y1="1" x2="13" y2="13"/><line x1="13" y1="1" x2="1" y2="13"/>
          </svg>
        </button>
      </div>
      <div id="help-body">
        <div class="help-section">
          <div class="help-section-title" data-i18n="helpSecTokens"></div>
          <div class="help-row"><span class="help-key" data-i18n="helpDragBoard"></span><span class="help-desc" data-i18n="helpDragBoardDesc"></span></div>
          <div class="help-row"><span class="help-key" data-i18n="helpMiddleTok"></span><span class="help-desc" data-i18n="helpMiddleTokDesc"></span></div>
          <div class="help-row"><span class="help-key" data-i18n="helpRightTok"></span><span class="help-desc" data-i18n="helpRightTokDesc"></span></div>
        </div>
        <div class="help-section">
          <div class="help-section-title" data-i18n="helpSecGeneral"></div>
          <div class="help-row"><kbd>Ctrl Z / Ctrl Y</kbd><span class="help-desc" data-i18n="helpArrowKeys"></span></div>
          <div class="help-row"><kbd>← →</kbd><span class="help-desc" data-i18n="helpArrowKeys"></span></div>
          <div class="help-row"><kbd>Esc</kbd><span class="help-desc" data-i18n="helpEsc"></span></div>
        </div>
      </div>
    </div>
  </div>
  
  <!-- ── Settings popup ── -->
  <div id="settings-overlay" class="hidden">
    <div id="settings-popup">
      <div id="settings-header">
        <span id="settings-title">Paramètres</span>
        <button id="settings-close">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <line x1="1" y1="1" x2="13" y2="13"/><line x1="13" y1="1" x2="1" y2="13"/>
          </svg>
        </button>
      </div>
      <div id="settings-body">
        <div class="setting-row" id="row-labels">
          <div class="setting-info">
            <div class="setting-name">Indices plateau</div>
            <div class="setting-desc">Marque les coordonnées sur chaque case du plateau</div>
          </div>
          <button class="toggle active" id="tog-labels" role="switch" aria-checked="true"></button>
        </div>
        <div class="setting-row" id="row-shadow">
          <div class="setting-info">
            <div class="setting-name">Ombres</div>
            <div class="setting-desc">Ajoute une ombre sous chaque personnage</div>
          </div>
          <button class="toggle active" id="tog-shadow" role="switch" aria-checked="true"></button>
        </div>
        <div class="setting-row setting-row-lang" id="row-lang">
          <div class="setting-name" data-i18n="rowLang">Langue</div>
          <div id="lang-trigger">
            <span id="lang-current-label">English</span>
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="5 2 10 7 5 12"/>
            </svg>
          </div>
        </div>

        <!-- Language submenu popup -->
        <div id="lang-submenu">
          <div class="lang-option" data-lang="fr">Français</div>
          <div class="lang-option" data-lang="en">English</div>
        </div>
      </div>
    </div>
  </div>

  <script src="palette.js"></script>
  <script src="palette2.js"></script>
  <script src="tooltip.js"></script>
  <script src="editor.js"></script>
  <script src="loader.js"></script>

</body>
</html>
